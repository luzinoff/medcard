<meta name="theme-color" content="#0f766e">
<title>Медкарта</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--mut:#6b7486;--line:#e2e6ed;--acc:#0f766e;--onacc:#fff;--acc2:#e3f3f1;--hi:#c2410c;--hibg:#fff0e6;--lo:#1d4ed8;--lobg:#e9efff;--danger:#b91c1c;--dangerbg:#fdecec;--ok:#15803d;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#0e1217;--card:#161b22;--ink:#e6e9ef;--mut:#8b94a5;--line:#262d38;--acc:#2dd4bf;--onacc:#042f2e;--acc2:#10302c;--hi:#fb923c;--hibg:#3a2214;--lo:#82a6ff;--lobg:#16213d;--danger:#f87171;--dangerbg:#3a1616;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);height:54px}
header h1{font-size:16px;margin:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{font-weight:400;color:var(--mut);margin-left:8px}
.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:var(--ok)}.dot.err{background:var(--danger)}.dot.busy{background:#eab308}
.sp{flex:1}
.layout{display:grid;grid-template-columns:230px 1fr;max-width:1440px;margin:0 auto}
nav{position:sticky;top:54px;align-self:start;padding:16px 10px;height:calc(100vh - 54px);overflow:auto}
nav a{display:block;padding:8px 12px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;margin-bottom:2px}
nav a:hover{background:var(--acc2)}
nav a.on{background:var(--acc2);color:var(--acc);font-weight:600}
nav hr{border:none;border-top:1px solid var(--line);margin:10px 4px}
main{padding:18px 22px 80px;min-width:0}
section{display:none}section.on{display:block}
h2{font-size:21px;margin:2px 0 4px}
.lead{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card.alert{border-color:var(--danger);background:var(--dangerbg)}
.card.alert h3{color:var(--danger)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
button.sm{padding:3px 9px;font-size:12px}
button.ghost{border-color:transparent;background:transparent;padding:3px 6px}
button.ghost:hover{border-color:var(--line)}
button.danger{color:var(--danger)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--acc2) 45%,transparent)}
td.act{white-space:nowrap;text-align:right;width:1%}
.tw{overflow-x:auto}
.empty{color:var(--mut);font-size:13px;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
label.f.wide{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 40%,transparent);border-color:var(--acc)}
textarea{min-height:64px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.stat b{display:block;font-size:20px;font-weight:650}
.stat span{font-size:12px;color:var(--mut)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--acc2);color:var(--acc);margin:2px 4px 2px 0}
.chip.al{background:var(--card);color:var(--danger);border:1px solid var(--danger);font-size:13px;border-radius:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.g2>.card{margin-bottom:0}
@media (max-width:860px){.g2{grid-template-columns:1fr}}
.card.mini{padding:9px 16px}.card.mini h3{margin:0;font-size:14px}.card.mini h3 .muted{font-weight:400;font-size:12px}
details.card>summary{list-style:none;color:var(--ink)}details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:'▸';color:var(--mut);display:inline-block;width:16px;transition:transform .15s}details.card[open]>summary::before{transform:rotate(90deg)}
details.card[open]>summary{margin-bottom:8px}
.stat.kp{cursor:pointer}.stat.kp b{font-size:19px}.stat.kp b small{font-size:12px;font-weight:400;color:var(--mut)}.stat.kp.hi{border-color:var(--hi)}.stat.kp.lo{border-color:var(--lo)}
.stat.kp .k{display:block;font-size:12px;color:var(--ink);font-weight:600;margin-bottom:2px}
.att{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}.att:first-of-type{border-top:0}
.att b{font-weight:600}
.li{padding:6px 0;border-top:1px solid var(--line)}.li>*+*{margin-left:6px}.li .chip{margin:0}.li:first-of-type{border-top:0}
.fnd summary{font-size:12px;color:var(--mut);margin-top:6px}
.rng{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 10px;font-size:12px;color:var(--mut)}
.hons{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.hon{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}.hon .top{display:flex;align-items:baseline;gap:6px}.hon .big{font-size:20px}.hon .big .muted{font-size:13px;font-weight:400}
.hon .bar{height:8px;border-radius:99px;background:var(--line);margin:8px 0 4px;overflow:hidden}.hon .bar i{display:block;height:100%;border-radius:99px}.hon>.muted{font-size:12px}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.grph{margin:14px 0 2px;font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.grph .muted{font-weight:400;font-size:12px}
.card h3+.grph{margin-top:2px}
.chrt table{table-layout:fixed}.chrt th:last-child,.chrt td.act{width:96px}.chrt th:nth-child(1){width:36%}.chrt th:nth-child(2){width:72px}.chrt th:nth-child(3){width:118px}.chrt.spec th:nth-child(4){width:104px}
@media (max-width:860px){.chrt table{table-layout:auto}}
.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}.seg button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);position:relative}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
.tabs button i{font-style:normal;color:var(--mut);font-size:11px;margin-left:4px}
td.hi{background:var(--hibg);color:var(--hi);font-weight:600}
td.lo{background:var(--lobg);color:var(--lo);font-weight:600}
.lab th.d{cursor:pointer;text-align:right}
.lab th.d:hover{color:var(--acc)}
.lab th.d small{display:block;font-weight:400}
.lab td.p{cursor:pointer;font-weight:500;white-space:nowrap}
.lab td.p:hover{color:var(--acc)}
.lab td.v{white-space:nowrap;text-align:right}
.lab td.cv{background-image:radial-gradient(circle at 92% 18%,var(--mut) 1.5px,transparent 2px)}
.lab td:first-child{position:sticky;left:0;background:var(--card)}
/* таблицы динамики: все столбцы дат одной ширины, длинные подписи — с многоточием (полностью — в подсказке) */
table.pv{width:auto;min-width:0;table-layout:fixed}
table.pv th:first-child,table.pv td:first-child{width:230px;min-width:230px;max-width:230px;white-space:normal}
table.pv th.nrm,table.pv td.ref{width:130px;min-width:130px;max-width:130px;white-space:normal}
table.pv th.d,table.pv td.v{width:108px;min-width:108px;max-width:108px}
table.pv th.d small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.pv td.v{overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){table.pv th:first-child,table.pv td:first-child{width:150px;min-width:150px;max-width:150px}table.pv th.nrm,table.pv td.ref{width:96px;min-width:96px;max-width:96px}table.pv th.d,table.pv td.v{width:88px;min-width:88px;max-width:88px}}
.ref{color:var(--mut);font-size:12px;white-space:nowrap}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:none}
.item .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .top b{font-size:14px}
.item p{margin:6px 0 0;white-space:pre-wrap}
.item p em{font-style:normal;color:var(--mut);font-size:12px;display:block}
dialog{border:none;border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(820px,95vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:16px;flex:1}
.db{padding:16px 18px;overflow:auto;max-height:calc(92vh - 130px)}
.df{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.muted{color:var(--mut);font-size:12px}
.lrt input{padding:5px 7px}
.lrt td{padding:3px 4px;border:none}
svg.ch text{fill:var(--mut);font-size:11px}
.q{display:inline-block;min-width:22px;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:600;text-align:center;white-space:nowrap}
.q.neg{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.q.low{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.q.pos{background:var(--hibg);color:var(--hi)}
.q.lo{background:var(--lobg);color:var(--lo)}
.q.val{background:var(--bg);color:var(--ink);font-weight:500}
.q.sS{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}

const BENIGN=new Map([['ЛПВП','hi'],['ЛПНП','lo'],['ЛПОНП','lo'],['Триглицериды','lo'],['Холестерин общий','lo'],['Коэффициент атерогенности','lo'],['СРБ','lo'],['Гомоцистеин','lo'],['Билирубин общий','lo'],['Билирубин прямой','lo'],['СОЭ','lo'],['IgE общий','lo'],['ГГТ','lo'],['АЛТ','lo'],['АСТ','lo']].map(([k,v])=>[norm(k),v]));

function sortedLabs(){return data.labs.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)))}
function allResults(param){const out=[];data.labs.forEach(t=>t.results.forEach(r=>{if(norm(r.param)===norm(param))out.push({d:t.date,r:canon(r,param),t})}));return out.sort((a,b)=>String(a.d).localeCompare(String(b.d)))}

 sortedLabs().forEach(t=>t.results.forEach(r=>{if(r.value!==''&&r.value!=null)latest.set(norm(r.param)+(t.panel==='infections'?'|'+norm(t.material):''),{t,r})}));

const FRESH_DAYS=365;

function devTable(dev){dev=dev.slice().sort((a,b)=>String(b.t.date).localeCompare(String(a.t.date)));return`<div class="tw"><table><thead><tr><th>Показатель</th><th>Значение</th><th>Норма</th><th>Дата</th></tr></thead><tbody>${dev.map(({t,r})=>{const f=flag(r);return`<tr><td class="p" style="cursor:pointer" data-act="chart" data-param="${esc(r.param)}">${esc(r.param)}</td><td class="${f}">${esc(r.value)} ${esc(r.unit||'')} ${f==='hi'?'↑':'↓'}</td><td class="ref">${esc(refText(r))}</td><td>${fmtD(t.date)}</td></tr>`}).join('')}</tbody></table></div>`}

/* короткие подписи учреждений для узких столбцов; полное название — в подсказке */
const shortLab=l=>String(l||'').replace(/^Вологодская городская больница\s*/i,'ГБ ').replace(/^Вологодская городская поликлиника\s*/i,'ГП ').replace(/^Вологодская ОСПК\s*/i,'ОСПК ').replace(/^Филиал\s*№\s*1\s*ВОСПК.*Сокол.*/i,'ОСПК, филиал Сокол').replace(/^Вологодская областная клиническая больница/i,'ВОКБ').replace(/^Вологодская областная детская больница/i,'ВОДКБ').replace(/^Вологодский (областной )?/i,'').trim();
function colHead(t){const sub=[t.method,t.material].filter(Boolean).join(' · ');return`<th class="d" data-act="lab-edit" data-id="${t.id}" title="${esc([t.title,t.lab,t.conclusion].filter(Boolean).join('\n'))}">${fmtD(t.date)}<small>${esc(sub)||'&nbsp;'}</small><small>${esc(shortLab(t.lab))||'&nbsp;'}</small>${t.docId?'<small>📄</small>':''}</th>`}
function igeClass(v){v=num(v);if(v==null)return null;return v<0.35?0:v<0.7?1:v<3.5?2:v<17.5?3:v<50?4:v<100?5:6}
function pivot(tests){if(!tests.length)return'<div class="empty">Нет анализов в этой группе. Нажмите «Внести анализ» или загрузите PDF.</div>';
 const names=[],seen=new Set(),add=n=>{const k=norm(n);if(!seen.has(k)){seen.add(k);names.push(n)}};
 PANELS[labPanel].params.forEach(p=>{if(tests.some(t=>t.results.some(r=>norm(r.param)===norm(p[0]))))add(p[0])});
 tests.forEach(t=>t.results.forEach(r=>add(r.param)));
 const find=(t,n)=>{const r=t.results.find(r=>norm(r.param)===norm(n));return r?canon(r,n):r};
 names.splice(0,names.length,...names.filter(n=>tests.some(t=>{const r=find(t,n);return r&&r.value!==''&&r.value!=null})));
 return`<div class="tw"><table class="lab pv"><thead><tr><th>Показатель</th><th class="nrm">Норма</th>${tests.map(colHead).join('')}</tr></thead><tbody>
 ${names.map(n=>{let refR=null;for(const t of tests){const r=find(t,n);if(r&&(refText(r)||r.unit))refR=r}
  return`<tr><td class="p" data-act="chart" data-param="${esc(n)}">${esc(n)}</td><td class="ref">${refR?esc(refText(refR))+' '+esc(refR.unit||''):''}</td>${tests.map(t=>{const r=find(t,n);if(!r||r.value===''||r.value==null)return'<td class="v"></td>';const f=flag(r);const tip=[refText(r)?'норма '+refText(r)+' '+(r.unit||''):'',r._orig?'в бланке: '+r._orig:'',r.origName?'в бланке назван: '+r.origName:'',r.note||''].filter(Boolean).join('\n');const kl=/^IgE:/i.test(n)?igeClass(r.value):null;return`<td class="v ${f}${r._orig||r.origName?' cv':''}" title="${esc(tip)}">${esc(r.value)}${f==='hi'?' ↑':f==='lo'?' ↓':''}${kl!=null?` <small class="muted">кл.${kl}</small>`:''}</td>`}).join('')}</tr>`}).join('')}
 </tbody></table></div><div class="muted" style="margin-top:6px">Значения с точкой в углу пересчитаны в общую единицу или переименованы — исходник из бланка во всплывающей подсказке.</div>`}

 const known=new Set(ORGS.map(norm));const extra=[];tests.forEach(t=>t.results.forEach(r=>{const k=norm(r.param);if(!known.has(k)&&!extra.some(e=>norm(e)===k))extra.push(r.param)}));
 const groups=ORG_GROUPS.map(([g,l])=>[g,l.filter(n=>present.has(norm(n)))]).concat(extra.length?[['Другое',extra]]:[]).filter(g=>g[1].length);

/* Размеры органов в динамике: одинаковые измерения из разных исследований */
/* «Протрузия С5-6», «грыжа диска C5–C6», «Экструзия L4-5» → «Диск C5–C6» / «Диск L4–L5»: одна строка динамики по сегменту.
   Кириллическая «С» в названиях сегментов заменяется латинской. */
function metricName(n){let s=String(n||'').trim().replace(/[СсCc](?=\s*\d)/g,'C').replace(/[Ll](?=\s*\d)/g,'L').replace(/[Th]{2}(?=\s*\d)/gi,'Th').replace(/[Ss](?=\s*\d)/g,'S');
 s=s.replace(/\b(C|L|Th|S)\s*(\d+)\s*[-–—]\s*(C|L|Th|S)?\s*(\d+)/g,(m,a,x,b,y)=>`${a}${x}–${b||a}${y}`);
 return s.replace(/^(дорсальная\s+|задняя\s+|срединная\s+|медиальная\s+|фораминальная\s+)*(грыжа|протрузия|экструзия|выпячивание|секвестр)(\s+диска)?\s+/i,'Диск ')}
function metricsHTML(src=data.imaging){const m=new Map();src.forEach(r=>(r.metrics||[]).forEach(x=>{if(x.value===''||x.value==null)return;const nm=metricName(x.name);const k=norm(nm);x=Object.assign({},x,{name:nm});if(!m.has(k))m.set(k,{name:x.name,unit:x.unit,pts:[]});m.get(k).pts.push({d:r.date,v:isNumVal(x.value)?num(x.value):String(x.value),r})}));
 const segOrd=n=>{const r=String(n).match(/\b(C|Th|L|S)(\d+)/);return r?({C:0,Th:100,L:200,S:300}[r[1]]+ +r[2]):999};
 const rows=[...m.values()].filter(x=>x.pts.length>1).sort((a,b)=>segOrd(a.name)-segOrd(b.name)||a.name.localeCompare(b.name,'ru'));if(!rows.length)return'';
 return`<div style="margin-bottom:6px"><h4 style="margin:0 0 4px;font-size:13px">📏 Размеры в динамике</h4><div class="tw"><table><thead><tr><th>Показатель</th><th>Значения (старые → новые)</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="p" ${x.pts.every(p=>typeof p.v==='number')?`data-act="mchart" data-param="${esc(x.name)}" style="cursor:pointer" title="График"`:''}>${esc(x.name)}${x.unit?', '+esc(x.unit):''}</td><td>${x.pts.sort((a,b)=>String(a.d).localeCompare(String(b.d))).map(p=>`<span class="chip">${fmtD(p.d)}: <b>${esc(p.v)}</b></span>`).join(' ')}</td></tr>`).join('')}</tbody></table></div></div>`}
function openMChart(name){const pts=[];data.imaging.forEach(r=>(r.metrics||[]).forEach(x=>{if(norm(metricName(x.name))===norm(name)&&num(x.value)!=null)pts.push({d:r.date,v:num(x.value)})}));modal(name,drawChart(pts,{}),['sp',{label:'Закрыть'}])}

/* ================= График ================= */
function drawChart(pts,{low=null,high=null,markers=[],unit='',color='var(--acc)',extra=null}={}){
 pts=pts.filter(p=>p.d&&!isNaN(new Date(p.d)));if(!pts.length)return'<div class="empty">Нет числовых значений для графика</div>';
 const W=700,H=250,L=48,R=34,T=16,B=32;const all=extra?pts.concat(extra.pts):pts;const ts=all.map(p=>+new Date(p.d));let t0=Math.min(...ts),t1=Math.max(...ts);
 const mk=markers.map(m=>({...m,ts:+new Date(m.d)})).filter(m=>!isNaN(m.ts));
 mk.forEach(m=>{if(m.ts<t0&&t0-m.ts<120*864e5)t0=m.ts;if(m.ts>t1&&m.ts-t1<120*864e5)t1=m.ts});
 if(t0===t1){t0-=15*864e5;t1+=15*864e5}
 const vs=all.map(p=>p.v);if(low!=null)vs.push(low);if(high!=null)vs.push(high);let v0=Math.min(...vs),v1=Math.max(...vs);const pad=(v1-v0||Math.abs(v1)||1)*.12;v0-=pad;v1+=pad;
 const x=t=>L+(t-t0)/(t1-t0)*(W-L-R),y=v=>T+(v1-v)/(v1-v0)*(H-T-B);let s='';
 if(low!=null||high!=null){const a=y(high??v1),b=y(low??v0);s+=`<rect x="${L}" y="${a}" width="${W-L-R}" height="${Math.max(0,b-a)}" style="fill:var(--ok);opacity:.12"/>`}
 for(let i=0;i<=4;i++){const v=v0+(v1-v0)*i/4,yy=y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${+v.toFixed(v1-v0<5?2:v1-v0<50?1:0)}</text>`}
 mk.filter(m=>m.ts>=t0&&m.ts<=t1).forEach(m=>{const xx=x(m.ts);s+=`<line x1="${xx}" x2="${xx}" y1="${T}" y2="${H-B}" style="stroke:${DON_COLOR[m.t]||'var(--danger)'};opacity:.6" stroke-dasharray="3 3"><title>${esc(m.t||'Донация')} ${fmtD(m.d)}</title></line><text x="${xx}" y="${T+2}" text-anchor="middle" style="fill:${DON_COLOR[m.t]||'var(--danger)'}">●</text>`});
 const line=(ps,col)=>{const sp=ps.slice().sort((a,b)=>new Date(a.d)-new Date(b.d));let o=`<polyline fill="none" style="stroke:${col}" stroke-width="2" points="${sp.map(p=>x(+new Date(p.d))+','+y(p.v)).join(' ')}"/>`;
  sp.forEach(p=>{const f=p.r?flag(p.r):'';o+=`<circle cx="${x(+new Date(p.d))}" cy="${y(p.v)}" r="4.5" style="fill:${f==='hi'?'var(--hi)':f==='lo'?'var(--lo)':col};stroke:var(--card)" stroke-width="2"><title>${fmtD(p.d)}: ${p.v} ${esc(unit)}</title></circle>`});return o};
 s+=line(pts,color);if(extra)s+=line(extra.pts,extra.color);
 const sp=all.slice().sort((a,b)=>new Date(a.d)-new Date(b.d));const lx=[];sp.forEach(p=>{const xx=x(+new Date(p.d));if(lx.length&&xx-lx[lx.length-1].x<62)return;lx.push({x:xx,p})});const lastP=sp[sp.length-1],xl=x(+new Date(lastP.d));if(lx.length&&lx[lx.length-1].p!==lastP){if(xl-lx[lx.length-1].x<62)lx.pop();lx.push({x:xl,p:lastP})}lx.forEach(({x:xx,p})=>{s+=`<text x="${xx}" y="${H-10}" text-anchor="middle">${fmtD(p.d).slice(0,6)}${fmtD(p.d).slice(8)}</text>`});
 return`<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img">${s}</svg>`}

const AI_SYS=`Ты — внимательный помощник, который анализирует личную медицинскую карту пользователя. Данные — выжимка из его анализов, исследований, лечения, донаций и дневника.
Правила:
- Отвечай по-русски, опираясь только на данные карты; если данных не хватает — так и скажи и подскажи, что сдать или записать.
- Ссылайся на конкретные даты и значения. Учитывай, что нормы и методы у лабораторий разные, а нормы станции переливания крови и распечаток анализаторов шире или уже обычных.
- Для «корреляций» и «связей»: сопоставляй периоды приёма (даты начала/окончания) со значениями до, во время и после; честно указывай число точек и что это наблюдение, а не доказательство; учитывай другие факторы (донации, время забора, лаборатория).
- Не ставь диагнозов и не назначай лечение и дозировки; можно говорить, какие отклонения стоит обсудить с врачом и каким специалистом, какие анализы логично пересдать.
- Структура: короткий итог в начале, затем разбор по пунктам, в конце — «Что обсудить с врачом». Используй markdown: заголовки ###, списки, при необходимости небольшие таблицы.`;
function md(t){const e=esc(String(t||'')).replace(/\r/g,'');const lines=e.split('\n');let h='',list=null,tbl=null;
 const inl=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
 const close=()=>{if(list){h+=`</${list}>`;list=null}if(tbl){h+='</table>';tbl=null}};
 for(const l of lines){let m;
  if(/^\s*\|.*\|\s*$/.test(l)){if(/^\s*\|[\s:|-]+\|\s*$/.test(l))continue;const c=l.trim().slice(1,-1).split('|').map(x=>inl(x.trim()));if(!tbl){close();tbl=1;h+='<table><tr>'+c.map(x=>`<th>${x}</th>`).join('')+'</tr>'}else h+='<tr>'+c.map(x=>`<td>${x}</td>`).join('')+'</tr>';continue}
  if((m=l.match(/^\s*#{1,6}\s+(.*)/))){close();h+=`<h4>${inl(m[1])}</h4>`;continue}
  if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(list!=='ul'){close();list='ul';h+='<ul>'}h+=`<li>${inl(m[1])}</li>`;continue}
  if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){close();list='ol';h+='<ol>'}h+=`<li>${inl(m[1])}</li>`;continue}
  close();if(l.trim())h+=`<p>${inl(l)}</p>`}
 close();return h}

ДАТЫ: дата взятия материала / донации / исследования — не дата печати, выдачи или регистрации заказа. Если указана только дата поступления пробы — бери её.

АНАЛИЗЫ (labs): отдельный объект на каждый самостоятельный бланк/блок с разными датой, биоматериалом или методом. Если в одном PDF несколько блоков (например, посев на грибы + посев на флору + ПЦР) — несколько объектов.
- panel: кровь (гематология, в т.ч. у донора и распечатки анализаторов) → cbc; биохимия, общий белок и белковые фракции → bio; МНО, ПТИ, ПТВ, АЧТВ, фибриноген, D-димер → coag; гормоны и ПСА → hormones; всё про инфекции и микробиологию (ПЦР на возбудителей, посевы, антитела к инфекциям, Андрофлор/Фемофлор) → infections; моча и кал → urine; прочее (в т.ч. антиэритроцитарные антитела) → other. Группа крови и резус — НЕ в labs, а в profile.
- material: кратко в им. падеже: «кровь венозная», «секрет простаты», «соскоб из уретры», «эякулят», «моча», «отделяемое ротоглотки», «мазок».
- method: ПЦР (в т.ч. ДНК/РНК, Андрофлор), Посев (бактериологический, культуральный), Серология (антитела, антигены, RPR, ИФА, РПГА), Микроскопия, иначе Другое. Для крови/биохимии можно пусто.
- Названия показателей крови, биохимии, гормонов, мочи приводи к стандартным, если совпадают (иначе как в бланке, по-русски):
${names}
- Сокращения анализаторов: WBC → Лейкоциты, RBC → Эритроциты, HGB → Гемоглобин, HCT → Гематокрит, PLT → Тромбоциты, Neu%/Lym%/Mon%/Eos%/Bas% → Нейтрофилы/Лимфоциты/Моноциты/Эозинофилы/Базофилы (в %), Neu#/Lym#/Mon#/Eos#/Bas# → «… (абс.)», RDW-CV → RDW, PCT → Тромбокрит (PCT). Тестостерон «%» (свободный/биоактивный) → «Тестостерон свободный, %» / «Тестостерон биодоступный, %»; FAI → «Индекс свободных андрогенов».
- ЕДИНИЦЫ пиши ровно как в бланке (г/дл, нг/мл, мкг/л, млн/мкл, тыс/мкл, ‰ и т.д.), не пересчитывай — приложение пересчитает само.
- ОШИБКИ В НАЗВАНИЯХ. В протоколах ЕГИСЗ/МИС (государственные поликлиники и больницы) названия строк бывают перепутаны: «Среднее содержание гемоглобина в эритроците … 147 г/л» — это Гемоглобин (MCH измеряется в пг), а в анализе мочи встречаются нелепые строки вроде «Азалептин», «Велтодез», «Streptococcus pneumoniae ДНК в плевральной жидкости», «Haemophilus…». Определи показатель по единицам, величине, норме и месту в бланке (тест-полоска мочи обычно: белок, уробилиноген, глюкоза, кетоны, pH, эритроциты, билирубин, нитриты, лейкоциты, удельный вес). Пиши правильное название в param, исходное — в origName. Если определить нельзя — param «Неопознанный: <исходное название>», origName то же.
- Пометки отклонения в бланке: «*», «!», «H», «L», «↑», «↓», «+»/«++»/«-» сразу после числа («4.05-», «24.6++»), колонка «Интерпретация» со словами «Повышенный»/«Пониженный»/«Выше»/«Ниже» → abn true, в value — только число. «?» у анализатора — не отклонение. «<10.0» — оставь как есть строкой «<10.0».
- Длинные названия ЕГИСЗ сокращай до сути: «Лимфоциты, относительное количество в крови методом ручного подсчёта» → «Лимфоциты»; «…, абсолютное количество…» → «Лимфоциты (абс.)»; «Холестерин липопротеинов высокой плотности…» → «ЛПВП»; «Глюкоза натощак, молярная концентрация…» → «Глюкоза».
- Если один PDF содержит несколько отдельных бланков (у Инвитро и др. — по странице на исследование), объединяй их в один объект labs, если совпадают дата, panel, материал и метод.
- Анализ мочи: param с префиксом «Моча: » (Моча: белок, Моча: pH, Моча: лейкоциты…), кал — «Кал: …» (Кал: яйца гельминтов). «Neg» → «отрицательно», «Normal» → «норма».
- Для infections param — ТОЛЬКО название возбудителя без «ДНК», метода и материала, из этого списка, если совпадает: ${ORGS.join('; ')}. «Уреаплазмы, ДНК (Ureaplasma species)» → «Ureaplasma spp.»; «Ureaplasma (urealyticum + parvum)» → «Ureaplasma spp.»; «грибы рода Candida albicans» → «Candida albicans»; «Вирус герпеса 1 типа» → «HSV 1»; «Цитомегаловирус» → «CMV»; «ВПЧ 16 типа» → «HPV 16»; антитела к бледной трепонеме (RPR, РМП, РПГА, ИФА) → «Treponema pallidum (антитела)». Если возбудителя нет в списке — латинское название как в бланке.
- value: количественные — числом или записью вида «1.4×10^5»; качественные — текстом как в бланке, в нижнем регистре: «не обнаружено», «обнаружено», «ниже ПЗ», «нет роста», «рост +++». Для Андрофлор/Фемофлор value — значение Lg (или «не выявлено»), unit «Lg»; «% от ОБМ» можно в ref не писать.
- ref: текстовая норма, если она не числовая («не обнаружено», «отрицательно»). refLow/refHigh — числа нормы, «< 5» → refLow null, refHigh 5. Если норма «0» — refLow 0, refHigh 0.
- abn: true, если лаборатория отметила результат как отклонение (!, !!!, *, жирным, H/L, ↑/↓, «ОБНАРУЖЕНО» заглавными) или это положительный результат теста на инфекцию; иначе false.
- ПОСЕВЫ: каждый выросший микроорганизм — отдельная строка results: param — возбудитель, value — степень роста как в бланке («+», «+++», «10^4 КОЕ/мл»), sens — вся антибиотикограмма/антимикотикограмма: «Чувствителен» → S, «Умеренно/промежуточно» → I, «Устойчив» → R. Если роста нет — строки с value «нет роста» по тем группам, на которые был посев (напр. «Роста Candida и плесневых грибов не получено» → «Candida spp.» и «Плесневые грибы»), «Этиологически значимая флора не обнаружена» → param «Этиологически значимая флора», value «не обнаружено». В conclusion — итог бланка дословно кратко («Получен рост», «Роста не получено»).
- conclusion — также для «Заключение» в бланках Андрофлор и подобных.

ПЛАНЫ: из рекомендаций и назначений вынеси в plans всё, что нужно сделать позже: контрольные анализы и тесты, дообследования («Рек. МР-дообследование»), консультации, повторные исследования, а также подготовку к ним (что отменить и за сколько дней). due — конкретная дата: если срок задан относительно («через 2 месяца после окончания лечения»), вычисли его от дат в документе; если срок не указан — пусто.
НАЗНАЧЕНИЯ И РЕЦЕПТЫ (в т.ч. фото листка назначений, рукописный рецепт): medications — каждый препарат отдельно: name — МНН и торговое в скобках, dose, freq (кратность и связь с едой), start — дата назначения/рецепта (можно взять из даты фото или рукописной даты), end — start + длительность курса, kind «Курс», result — показание (напр. «эрадикация H. pylori»). Препараты «при плохой переносимости» и «после отмены» — тоже отдельными строками, в result укажи условие.
ЭКГ: imaging type «Функциональная», area «ЭКГ», conclusion — заключение (ритм, ЭОС, нарушения), metrics: «ЧСС на ЭКГ» (уд/мин).
ДУПЛЕКС/УЗДС СОСУДОВ: area — «БЦА (брахиоцефальные артерии)» или конкретно; metrics — ключевые: «Толщина КИМ ОСА» (мм), локальные утолщения/бляшки (мм, % стеноза), «Диаметр ПА справа»/«Диаметр ПА слева» (мм — сантиметры переведи в мм), «Диаметр ОСА» (мм); скорости кровотока не нужны.
УЗИ ОРГАНОВ: metrics — размеры, которые полезно сравнивать во времени: «Печень, правая доля» (мм), «Печень, левая доля», «Желчный пузырь» («72×31» мм), «Поджелудочная железа, головка/передне-задний» (мм), «Почка правая» («113×52» мм), «Почка левая», «Объём щитовидной железы» (см³), узлы и кисты (мм).
ФГДС, КОЛОНОСКОПИЯ: imaging type «Эндоскопия», conclusion дословно; диагнозы из заключения («Хронический атрофический гастрит») — в chronic со status «Под вопросом», если их не ставил лечащий врач.

ВЫПИСКИ ИЗ СТАЦИОНАРА И ЗАКЛЮЧЕНИЯ ВРАЧЕЙ: hospitalizations — даты поступления/выписки, учреждение, диагноз; surgeries — каждая операция с датой и имплантами (напр. «межостистая фиксация Coflex L4–L5»); chronic — диагнозы с кодом МКБ-10 (окончательные — «Активно», предварительные и направительные — «Под вопросом»); medications — назначения в стационаре kind «Курс» со start/end = даты госпитализации; vitals — пульс и АД из осмотра; labs — анализы, приведённые в тексте (коагулограмма → coag), с датой из текста; imaging — исследования, упомянутые в выписке (ЭКГ, рентген лёгких) одной строкой с заключением; complaints — жалобы на момент выписки, если остаются. В anamnesis/«отрицает» ничего не превращай в диагнозы; «Аллергические реакции: нет» — не создавай аллергий.
АЛЛЕРГОЛОГИЯ: panel «allergy»: «IgE общий»; специфические IgE — param «IgE: <аллерген кратко>» («IgE: луговые травы (смесь 2)», «IgE: деревья раннего цветения», «IgE: Dermatophagoides farinae», «IgE: пыль домашняя»), unit «МЕ/мл», refHigh 0.35, abn true если ≥0.35. Для аллергенов с классом ≥2 (≥0.7 МЕ/мл) добавь allergies: allergen — аллерген, type — «Сезонная / пыльца» или «Бытовая»/«Пищевая», reaction — «сенсибилизация IgE, класс N (значение МЕ/мл, дата)».
СПИРОМЕТРИЯ (ФВД): imaging type «Функциональная», area «ФВД (спирометрия)»; metrics: ЖЕЛ (VC), ФЖЕЛ (FVC), ОФВ1 (FEV1), ОФВ1/ФЖЕЛ, ПСВ (PEF), МОС25/50/75 — value — процент от должного (unit «% долж.»), если он есть, иначе абсолютное значение; conclusion — заключение (в т.ч. рукописное); рост и вес из шапки — в anthropometry.
ЛУЧЕВАЯ НАГРУЗКА: dose — эффективная доза в мЗв (ЭЭД 0,104 мЗв → 0.104; 23 мкЗв → 0.023).
МРТ/КТ/РЕНТГЕН ПОЗВОНОЧНИКА: metrics на каждый сегмент с грыжей/протрузией/экструзией: name «Диск L4–L5» (тип — грыжа/протрузия/экструзия — напиши в findings), value — передне-задний размер выпячивания в мм; при сужении канала — «Канал L4–L5, сагиттальный размер», мм. Сегменты — латиницей и полностью: C5–C6, L4–L5, L5–S1 (не «С5-6»). Для каждого отдела позвоночника — отдельный объект imaging с area «шейный отдел позвоночника» / «пояснично-крестцовый отдел позвоночника».
Если рост или вес в документе явно не согласуется с другими данными документа — всё равно перенеси как есть, приложение предупредит.

ИССЛЕДОВАНИЯ (УЗИ, МРТ, КТ, рентген, ЭКГ, эндоскопия): imaging; area — орган или область («предстательная железа», «мочевой пузырь», «щитовидная железа», «поясничный отдел позвоночника»); если в одном заключении несколько органов — можно одним объектом с area через запятую. metrics — измерения для отслеживания динамики (value — число; размеры в нескольких измерениях — строкой «45×30×25», unit «мм»): «Объём предстательной железы» (см³), «Остаточная моча» (мл), «Толщина стенки мочевого пузыря» (мм), размеры узлов/кист/грыж (мм), ФВ (%) и т.п.; название измерения — с органом.

document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.bind){setPath(data,t.dataset.bind,t.value);save(false);return}
 if(t.dataset.set){settings[t.dataset.set]=t.value.trim();saveSettings();return}
 if(t.dataset.setBool){settings[t.dataset.setBool]=t.checked;saveSettings();return}
 if(t.dataset.aiSec){aiOpt.sec[t.dataset.aiSec]=t.checked;try{localStorage.setItem('medcard.aiOpt',JSON.stringify(aiOpt))}catch{}return}
 if(t.name==='aiPer'){aiOpt.period=t.value;try{localStorage.setItem('medcard.aiOpt',JSON.stringify(aiOpt))}catch{}return}
 if(t.dataset.iv){settings.iv[t.dataset.iv]=num(t.value);saveSettings();renderDonor();return}
 if(t.id==='donorParam'){donorParam=t.value;renderDonor()}});
/* Браузер не должен подставлять в поля карты значения из других сайтов (дневник на том же адресе) */
document.addEventListener('focusin',e=>{const t=e.target;if(t&&/^(INPUT|TEXTAREA)$/.test(t.tagName)&&t.type!=='file')t.setAttribute('autocomplete','off')});
$('#fileAI').onchange=e=>handleAIFiles([...e.target.files]);
/* Файлы можно бросить в любое место страницы или вставить скриншот/фото через Ctrl+V */
let dragN=0;const isFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
document.addEventListener('dragenter',e=>{if(!isFiles(e))return;e.preventDefault();dragN++;$('#dropAll').classList.add('on')});
document.addEventListener('dragover',e=>{if(isFiles(e))e.preventDefault()});
document.addEventListener('dragleave',e=>{if(!isFiles(e))return;if(--dragN<=0){dragN=0;$('#dropAll').classList.remove('on')}});
document.addEventListener('drop',e=>{if(!isFiles(e))return;e.preventDefault();dragN=0;$('#dropAll').classList.remove('on');
 const fs=[...e.dataTransfer.files].filter(f=>/^image\/|pdf$/.test(f.type)||/\.pdf$/i.test(f.name));if(fs.length)handleAIFiles(fs);else toast('Поддерживаются PDF и фото')});
document.addEventListener('paste',e=>{const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))return;
 const fs=[...(e.clipboardData?.files||[])].filter(f=>/^image\/|pdf$/.test(f.type));if(!fs.length)return;e.preventDefault();
 handleAIFiles(fs.map((f,i)=>f.name&&f.name!=='image.png'?f:new File([f],`вставка-${today()}-${i+1}.${(f.type.split('/')[1]||'png')}`,{type:f.type})))});
$('#fileAttach').onchange=async e=>{const f=e.target.files[0];if(!f||!attachTo)return;toast('Загружаю на Google Диск…');if(await uploadOriginal(attachTo,f,false))toast('Оригинал сохранён');renderDocs()};
document.addEventListener('input',e=>{if(e.target.id==='docQ'){docQ=e.target.value;const pos=e.target.selectionStart;renderDocs();const el=$('#docQ');el.focus();el.setSelectionRange(pos,pos)}});
$('#fileJSON').onchange=async e=>{const f=e.target.files[0];if(!f)return;let o;try{o=JSON.parse(await f.text())}catch{return toast('Файл не является JSON')}
 if(e.target.dataset.mode==='restore'){if(!(o.profile&&o.version))return toast('Это не резервная копия медкарты');if(confirm('Заменить текущую карту содержимым файла?')){data=normalize(o);save()}}
 else handleDiary(o,'файл «'+f.name+'»')};
function show(sec){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id===sec));document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.sec===sec));history.replaceState(null,'','#'+sec);window.scrollTo(0,0)}
/* печать: свёрнутые блоки (годы документов, давние отклонения, находки) раскрываем */
window.addEventListener('beforeprint',()=>document.querySelectorAll('main details').forEach(d=>d.open=true));
$('#nav').onclick=e=>{const a=e.target.closest('a[data-sec]');if(a)show(a.dataset.sec)};

/* ================= Старт ================= */
renderAll();show((location.hash||'#home').slice(1).replace(/[^a-z]/g,'')||'home');
if(!document.querySelector('main section.on'))show('home');
if(location.protocol==='file:')setSync('','Локально · Google Диск работает только по http(s)');
else if(!settings.clientId)setSync('','Локально · укажите Client ID в настройках');
else if(!meta.everSignedIn)setSync('','Не подключено · нажмите 🔄');
else syncNow(false).catch(()=>{});
/* дневник — после первой синхронизации, чтобы не спорить с ней за вход */
setTimeout(()=>diaryAuto(),1500);
/* вернулись на вкладку — подтянуть правки с других устройств */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(autoOn())queueSync();diaryAuto()});
</script>
</body>
</html>
